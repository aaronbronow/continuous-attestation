# ============================================================================
# ESPHome Device Configuration — Sonoff S31 Smart Plug (Energy Monitoring)
# Hardware Reference: https://devices.esphome.io/devices/Sonoff-S31
# Sensor Reference:   https://esphome.io/components/sensor/cse7766.html
# Continuous Attestation Lineage:
#   - Block #0: Factory OEM eWeLink v2.6.1 (see attached owners-manual.pdf)
#   - Block #1: Flashed via 3.3V UART (J1 RX/TX) to ESPHome 2026.7.0
#   - Block #2: Home Assistant ESPHome OTA #1 -> 2026.8.2 (lwIP beacon patch)
#   - Block #3: Home Assistant ESPHome OTA #2 -> 2026.9.1 (ESPAsyncWebServer CVE fix)
#   - Block #4: Home Assistant ESPHome OTA #3 -> 2026.10.3 (Noise API key rotation)
# ============================================================================

substitutions:
  device_name: sonoff-s31-energy-plug
  friendly_name: "Sonoff S31 Energy Plug (Living Room)"
  esphome_version: "2026.10.3"
  upstream_device_url: "https://devices.esphome.io/devices/Sonoff-S31"

esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}
  project:
    name: "itead.sonoff_s31"
    version: ${esphome_version}

esp8266:
  board: esp01_1m
  restore_from_flash: true

logger:
  baud_rate: 0 # Disable hardware UART logging (UART0 RX is used by CSE7766 at 4800 baud)

api:
  encryption:
    key: "base64:NoiseNNpsk0_25519_ChaChaPoly_SHA256_RotatedKey2026=="

ota:
  - platform: esphome
    password: !secret ota_password
    version: 2

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  fast_connect: false

uart:
  rx_pin: RX
  baud_rate: 4800
  parity: EVEN

binary_sensor:
  - platform: gpio
    pin:
      number: GPIO0
      mode:
        input: true
        pullup: true
      inverted: true
    name: "${friendly_name} Button"
    on_press:
      - switch.toggle: relay

  - platform: status
    name: "${friendly_name} Status"

switch:
  - platform: gpio
    name: "${friendly_name} Relay"
    pin: GPIO12
    id: relay
    restore_mode: ALWAYS_ON

status_led:
  pin:
    number: GPIO13
    inverted: true

sensor:
  - platform: wifi_signal
    name: "${friendly_name} WiFi Signal"
    update_interval: 60s

  - platform: cse7766
    current:
      name: "${friendly_name} Current"
      accuracy_decimals: 2
      filters:
        - throttle_average: 5s
    voltage:
      name: "${friendly_name} Voltage"
      accuracy_decimals: 1
      filters:
        - throttle_average: 5s
    power:
      name: "${friendly_name} Active Power"
      accuracy_decimals: 1
      id: active_power
      filters:
        - throttle_average: 5s
    energy:
      name: "${friendly_name} Total Energy"
      accuracy_decimals: 3
