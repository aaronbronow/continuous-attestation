version: "v1"
rules:
  - name: "no-open-ended-operators"
    level: "error"
    target: "manifest"
    selector:
      ecosystems: ["golang", "npm", "bun"]
    condition:
      operator_is: [">=", "*"]
      message: "Open-ended version operators (>=, *) are disallowed under security policy."

  - name: "version-drift-limit"
    level: "warn"
    target: "package"
    selector:
      manifests: ["package-lock.json", "go.mod"]
    condition:
      max_drift_days: 180
      message: "Package drift exceeds 6 months threshold."

  - name: "never-forget-history"
    level: "error"
    target: "chain"
    condition:
      allow_forget: false
      message: "Deleting or pruning attestation history is blocked."

  - name: "cve-severity-threshold"
    level: "error"
    target: "package"
    condition:
      max_cve_severity: "HIGH"
      disallowed_licenses: ["GPL-3.0-only", "AGPL-3.0-only"]
      blocked_versions:
        "github.com/gin-gonic/gin": ["v1.9.0-rc1", "v1.10.0-vuln"]
      message: "Critical vulnerability or disallowed license detected in squashed SBOM."
